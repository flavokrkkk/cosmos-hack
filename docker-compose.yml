services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cosmos_hack
      POSTGRES_USER: cosmos_hack
      POSTGRES_PASSWORD: cosmos_hack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos_hack -d cosmos_hack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${COSMOS_OLLAMA_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build: ./backend
    environment:
      COSMOS_APP_NAME: Cosmos Hack API
      COSMOS_DEBUG: "true"
      COSMOS_CORS_ALLOWED_ORIGINS: http://localhost:5173
      COSMOS_DB_NAME: cosmos_hack
      COSMOS_DB_USER: cosmos_hack
      COSMOS_DB_PASS: cosmos_hack
      COSMOS_DB_HOST: db
      COSMOS_DB_PORT: 5432
      COSMOS_JWT_SECRET_KEY: ${COSMOS_JWT_SECRET_KEY:-local-development-secret-at-least-32-bytes}
      COSMOS_BOOTSTRAP_ADMIN_USERNAME: ${COSMOS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      COSMOS_BOOTSTRAP_ADMIN_PASSWORD: ${COSMOS_BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
      COSMOS_REDIS_URL: redis://redis:6379/0
      COSMOS_OLLAMA_BASE_URL: http://ollama:11434
      COSMOS_OLLAMA_MODEL: ${COSMOS_OLLAMA_MODEL:-qwen3:4b}
      COSMOS_OLLAMA_TIMEOUT_SECONDS: ${COSMOS_OLLAMA_TIMEOUT_SECONDS:-180}
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    command: taskiq worker app.tasks.broker:broker --workers 1
    environment:
      COSMOS_DB_NAME: cosmos_hack
      COSMOS_DB_USER: cosmos_hack
      COSMOS_DB_PASS: cosmos_hack
      COSMOS_DB_HOST: db
      COSMOS_DB_PORT: 5432
      COSMOS_REDIS_URL: redis://redis:6379/0
      COSMOS_OLLAMA_BASE_URL: http://ollama:11434
      COSMOS_OLLAMA_MODEL: ${COSMOS_OLLAMA_MODEL:-qwen3:4b}
      COSMOS_OLLAMA_TIMEOUT_SECONDS: ${COSMOS_OLLAMA_TIMEOUT_SECONDS:-180}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - app
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
