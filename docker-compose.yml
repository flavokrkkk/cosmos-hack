services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cosmos_hack
      POSTGRES_USER: cosmos_hack
      POSTGRES_PASSWORD: cosmos_hack
    ports:
      - "${COSMOS_DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos_hack -d cosmos_hack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${COSMOS_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${COSMOS_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${COSMOS_OLLAMA_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COSMOS_APP_NAME: Cosmos Hack API
      COSMOS_DEBUG: "true"
      # 5174 — запасной порт Vite: если 5173 занят другим проектом, dev-сервер
      # переезжает сам, и без этого origin логин падал бы на CORS.
      COSMOS_CORS_ALLOWED_ORIGINS: ${COSMOS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      COSMOS_DB_NAME: cosmos_hack
      COSMOS_DB_USER: cosmos_hack
      COSMOS_DB_PASS: cosmos_hack
      COSMOS_DB_HOST: db
      COSMOS_DB_PORT: 5432
      COSMOS_JWT_SECRET_KEY: ${COSMOS_JWT_SECRET_KEY:-local-development-secret-at-least-32-bytes}
      COSMOS_BOOTSTRAP_ADMIN_USERNAME: ${COSMOS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      COSMOS_BOOTSTRAP_ADMIN_PASSWORD: ${COSMOS_BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
      COSMOS_REDIS_URL: redis://redis:6379/0
      COSMOS_OLLAMA_BASE_URL: http://ollama:11434
      COSMOS_OLLAMA_MODEL: ${COSMOS_OLLAMA_MODEL:-qwen3:4b}
      COSMOS_OLLAMA_TIMEOUT_SECONDS: ${COSMOS_OLLAMA_TIMEOUT_SECONDS:-180}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${COSMOS_API_HOST_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: taskiq worker app.tasks.broker:broker --workers 1
    environment:
      COSMOS_DB_NAME: cosmos_hack
      COSMOS_DB_USER: cosmos_hack
      COSMOS_DB_PASS: cosmos_hack
      COSMOS_DB_HOST: db
      COSMOS_DB_PORT: 5432
      COSMOS_REDIS_URL: redis://redis:6379/0
      COSMOS_OLLAMA_BASE_URL: http://ollama:11434
      COSMOS_OLLAMA_MODEL: ${COSMOS_OLLAMA_MODEL:-qwen3:4b}
      COSMOS_OLLAMA_TIMEOUT_SECONDS: ${COSMOS_OLLAMA_TIMEOUT_SECONDS:-180}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - app
    ports:
      - "${COSMOS_WEB_HOST_PORT:-5173}:80"
    restart: unless-stopped

  # Публичный туннель на демо. Вынесен в профиль, иначе обычный `docker compose up`
  # падает с «required variable TUNA_DOMAIN is missing a value» у всех, кто не
  # завёл TUNA_*. Запуск туннеля: docker compose --profile tunnel up -d tuna
  tuna:
    profiles: ["tunnel"]
    image: yuccastream/tuna:latest
    command: http frontend:80 --inspect=false --domain=${TUNA_DOMAIN:-} --location=${TUNA_LOCATION:-nl}
    environment:
      TUNA_TOKEN: ${TUNA_TOKEN:-}
      TUNA_LOG: stdout
      TUNA_LOG_LEVEL: info
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
