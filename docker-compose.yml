# Локальная проверка для жюри: docker compose up -d --build --wait
# Ollama и туннель команды находятся в docker-compose.team.yml.
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COSMOS_APP_NAME: Cosmos Hack API
      COSMOS_DEBUG: "false"
      COSMOS_ROOT_PATH: /api
      COSMOS_OLLAMA_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COSMOS_WEB_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
